<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Clone</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Roboto", Arial, sans-serif;
            background-color: #f9f9f9;
            color: #0f0f0f;
            overflow-x: hidden;
        }

        /* --- HEADER / TOP NAV --- */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 56px;
            background-color: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
            z-index: 100;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .menu-icon {
            font-size: 20px;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
        }

        .menu-icon:hover {
            background-color: #e5e5e5;
        }

        .logo-container {
            display: flex;
            align-items: center;
            text-decoration: none;
            color: inherit;
        }

        .yt-logo {
            color: #ff0000;
            font-size: 28px;
            margin-right: 4px;
        }

        .logo-text {
            font-size: 20px;
            font-weight: bold;
            letter-spacing: -1px;
            font-family: "Oswald", sans-serif;
        }

        .nav-center {
            display: flex;
            align-items: center;
            flex: 0 1 600px;
        }

        .search-form {
            display: flex;
            width: 100%;
        }

        .search-form input {
            flex: 1;
            height: 40px;
            padding: 0 16px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 40px 0 0 40px;
            outline: none;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.05);
        }

        .search-form input:focus {
            border-color: #1c62b9;
        }

        .search-btn {
            width: 64px;
            height: 40px;
            background-color: #f8f8f8;
            border: 1px solid #ccc;
            border-left: none;
            border-radius: 0 40px 40px 0;
            cursor: pointer;
            font-size: 16px;
        }

        .search-btn:hover {
            background-color: #f0f0f0;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-icon {
            font-size: 20px;
            padding: 8px;
            cursor: pointer;
        }

        .profile-pic {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: #1a73e8;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            cursor: pointer;
        }

        /* --- MAIN BODY LAYOUT --- */
        .wrapper {
            display: flex;
            margin-top: 56px;
        }

        /* --- SIDEBAR --- */
        aside {
            width: 240px;
            position: fixed;
            top: 56px;
            bottom: 0;
            left: 0;
            background-color: #ffffff;
            padding: 12px 0;
            overflow-y: auto;
        }

        .sidebar-item {
            display: flex;
            align-items: center;
            padding: 0 24px;
            height: 40px;
            text-decoration: none;
            color: #0f0f0f;
            gap: 24px;
        }
