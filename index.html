<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            font-size: 14px;
            color: #202124;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Header / Navigation */
        header {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 15px 30px;
            gap: 15px;
        }

        header a {
            color: #000000;
            text-decoration: none;
            opacity: 0.85;
        }

        header a:hover {
            text-decoration: underline;
        }

        .sign-in-btn {
            background-color: #1a73e8;
            color: white !important;
            padding: 9px 23px;
            border-radius: 4px;
            font-weight: 500;
        }

        .sign-in-btn:hover {
            background-color: #1557b0;
            text-decoration: none !important;
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);
        }

        /* Main Search Area */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: -50px; /* Shifts everything slightly up for classic Google layout */
        }

        .logo {
            font-size: 90px;
            font-weight: 500;
            letter-spacing: -2px;
            margin-bottom: 30px;
            user-select: none;
        }

        /* Google Logo Colors */
        .g1 { color: #4285F4; }
        .o1 { color: #EA4335; }
        .o2 { color: #FBBC05; }
        .g2 { color: #4285F4; }
        .l  { color: #34A853; }
        .e  { color: #EA4335; }

        .search-container {
            width: 100%;
            max-width: 584px;
            padding: 0 20px;
        }

        .search-box {
            display: flex;
            align-items: center;
            border: 1px solid #dfe1e5;
            border-radius: 24px;
            padding: 0 15px;
            height: 46px;
            transition: box-shadow 0.1s;
        }

        .search-box:hover, .search-box:focus-within {
            box-shadow: 0 1px 6px rgba(32,33,36,0.28);
            border-color: rgba(223,225,229,0);
        }

        .search-box input {
            flex: 1;
            height: 100%;
            border: none;
            outline: none;
            font-size: 16px;
            padding-left: 10px;
        }

        /* Glass / Search icon representation */
        .search-icon {
            color: #9aa0a6;
            font-size: 18px;
        }

        .buttons-container {
            margin-top: 25px;
            display: flex;
            gap: 12px;
        }

        .btn {
            background-color: #f8f9fa;
            border: 1px solid #f8f9fa;
            border-radius: 4px;
            color: #3c4043;
            font-size: 14px;
            padding: 0 16px;
            line-height: 34px;
            height: 36px;
            cursor: pointer;
            user-select: none;
        }

        .btn:hover {
            box-shadow: 0 1px 1px rgba(0,0,0,0.1);
            background-color: #f8f9fa;
            border: 1px solid #dadce0;
            color: #202124;
        }

        /* Footer Section */
        footer {
            background-color: #f2f2f2;
            color: #70757a;
            border-top: 1px solid #e4e4e4;
        }

        .footer-location {
            padding: 15px 30px;
            border-bottom: 1px solid #e4e4e4;
        }

        .footer-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            padding: 15px 30px;
        }

        .footer-links div {
            display: flex;
            gap: 25px;
        }

        footer a {
            color: #70757a;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <header>
        <a href="#">Gmail</a>
        <a href="#">Images</a>
        <a href="#" class="sign-in-btn">Sign in</a>
    </header>

    <!-- Main Content -->
    <main>
        <!-- Custom Styled Google Text Logo -->
        <div class="logo">
            <span class="g1">G</span><span class="o1">o</span><span class="o2">o</span><span class="g2">g</span><span class="l">l</span><span class="e">e</span>
        </div>

        <!-- Search Bar -->
        <div class="search-container">
            <form action="https://www.google.com/search" method="GET">
                <div class="search-box">
                    <span class="search-icon">🔍</span>
                    <input type="text" name="q" autocomplete="off" autofocus>
                </div>
                
                <!-- Action Buttons -->
                <div class="buttons-container">
                    <button type="submit" class="btn">Google Search</button>
                    <button type="button" class="btn" onclick="window.location.href='https://doodles.google/'">I'm Feeling Lucky</button>
                </div>
            </form>
        </div>
    </main>

    <!-- Footer Area -->
    <footer>
        <div class="footer-location">India</div>
        <div class="footer-links">
            <div>
                <a href="#">About</a>
                <a href="#">Advertising</a>
                <a href="#">Business</a>
                <a href="#">How Search works</a>
            </div>
            <div>
                <a href="#">Privacy</a>
                <a href="#">Terms</a>
                <a href="#">Settings</a>
            </div>
        </div>
    </footer>

</body>
</html>
