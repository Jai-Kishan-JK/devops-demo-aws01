<!DOCTYPE html>
<html>
<head>
    <title>Simple Facebook Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding-top: 100px;
            text-align: center;
        }
        .container {
            width: 350px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .logo {
            color: #1877f2;
            font-size: 40px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .btn-login {
            width: 96%;
            padding: 12px;
            background-color: #1877f2;
            color: white;
            border: none;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-create {
            width: auto;
            padding: 10px 20px;
            background-color: #42b72a;
            color: white;
            border: none;
            font-weight: bold;
            border-radius: 4px;
            margin-top: 15px;
            cursor: pointer;
        }
        hr {
            margin: 20px 0;
            border: 0;
            border-top: 1px solid #ddd;
        }
    </style>
</head>
<body>

    <div class="logo">facebook</div>

    <div class="container">
        <form>
            <input type="text" placeholder="Email or phone number" required>
            <input type="password" placeholder="Password" required>
            <button type="submit" class="btn-login">Log In</button>
            <br>
            <a href="#" style="color: #1877f2; text-decoration: none; font-size: 14px; display: inline-block; margin-top: 10px;">Forgotten password?</a>
            <hr>
            <button type="button" class="btn-create">Create new account</button>
        </form>
    </div>

</body>
</html>
